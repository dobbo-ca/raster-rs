[package]
name = "raster"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "8-bit grey and RGB raster kernels: exact 2:1 scale, Catmull-Rom resample, luma, quarter-turn rotate. Rust port of dobbo-ca/raster-go."
publish = false

[features]
# Test hook for parity/fuzz: fail the Nth cancel check (see docs/parity.md). Not for callers.
cancel-hook = []

[dependencies]
# Worker pool: the caller's or the crate's lazy shared one. See the README (Dependencies).
rayon = "=1.12.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
